id: iso-42001:A.5.2
instrument: iso-42001
citation: A.5.2
title: Repeatable process for assessing AI system impacts
applies_from: null
role: both
system_class:
- all
summary: Requires the organisation to have a defined, repeatable way of working out how an AI system
  could affect people and society, rather than deciding case by case. An auditor looks for the procedure
  itself and for evidence it was actually applied to this system at the points it claims to apply.
evidence_expected: The written procedure, showing its trigger points (for example before release
  and after a material change), who performs it and how results are treated; plus completed assessment
  records for the LLM application that demonstrate the procedure was followed at those trigger points
  rather than retrofitted.
verifiable: review
status: active
source_url: https://www.iso.org/standard/42001
last_checked: '2026-10-15'
verification: unconfirmed
