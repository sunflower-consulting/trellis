id: cra:Annex I Part II(5)
instrument: cra
citation: Annex I Part II(5)
title: Vulnerability handling requirements
applies_from: '2027-12-11'
role: manufacturer
system_class:
- product-with-digital-elements
summary: The manufacturer must put a coordinated vulnerability disclosure policy in place and enforce
  it.
evidence_expected: The published policy, and evidence it is actually followed, such as handling
  records for externally reported vulnerabilities showing acknowledgement, triage and disclosure
  against the policy's own terms.
verifiable: review
status: active
source_url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
last_checked: '2026-10-15'
verification: source-confirmed
notes: Existence is documentary. Enforcement is shown by case records rather than by probing, so
  this stays review.
