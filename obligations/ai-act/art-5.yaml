id: ai-act:Art.5
instrument: ai-act
citation: Art.5
title: Prohibited AI practices
applies_from: '2025-02-02'
role: both
system_class:
- prohibited
summary: 'Bans a defined list of AI practices, binding whoever places such a system on the market,
  puts it into service or uses it. Several limbs carry their own carve-outs, so the list is not
  a set of unqualified bans. Applicable since 2 February 2025: subliminal or manipulative techniques,
  and exploitation of vulnerability tied to age, disability or socio-economic situation, in each
  case where behaviour is materially distorted and significant harm is caused or reasonably likely;
  social scoring; predicting criminal offending from profiling or personality traits alone; untargeted
  scraping of facial images to build or expand recognition databases; emotion inference in workplaces
  and education, outside medical and safety uses; biometric categorisation inferring sensitive traits;
  and real-time remote biometric identification in publicly accessible spaces for law enforcement,
  which is permitted only for narrow listed objectives and subject to prior authorisation and further
  conditions. Two limbs added by the Digital Omnibus apply only from 2 December 2026 and are drawn
  far more narrowly than the rest. The first covers systems that generate or manipulate realistic
  depictions of an identifiable person''s intimate parts, or of that person engaged in sexually
  explicit activity, absent that person''s freely given, specific, informed, unambiguous and explicit
  consent to the generation or manipulation; editing that neither increases the exposure of depicted
  intimate parts nor alters the nature of the depicted activity does not count as manipulation for
  this limb. The second covers systems that generate or manipulate child sexual abuse material and
  pornographic performance as defined in Directive 2011/93/EU, subject to any defence under national
  law for acting with legal right. For both new limbs the prohibition is split by role. The supply-side
  limb reaches a provider only where such generation or manipulation is the system''s intended purpose,
  or where the system''s design, training, architecture, capabilities or user-facing functionality
  make it a reasonably foreseeable and reproducible outcome without significant technical modification
  and the system lacks reasonable and adequate technical safety measures and other safeguards to
  reliably prevent it, taking reasonably foreseeable misuse into account, and to correct misuse
  once observed or reported. The use-side limb reaches a deployer only where the deployer uses the
  system for the purpose of producing such material. Capability for misuse alone therefore does
  not engage either new limb where adequate preventive and corrective safeguards are in place.'
evidence_expected: A written assessment mapping the deployment's intended purpose, deployment context
  and user population against each prohibition, with a reasoned conclusion per limb; plus, for the
  generative prohibitions, red-team transcripts showing the system refuses to produce the prohibited
  material and a record of the safeguards relied on.
verifiable: hybrid
status: active
source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-5
last_checked: '2026-10-15'
verification: source-confirmed
notes: 'Two application dates, and the record carries the earlier because that is when the article
  first binds: points (a) to (h) from 2025-02-02, and the limbs the Omnibus inserted - Article 5(1)
  points (ba) and (bb) and paragraphs 1a and 1b - from 2026-12-02, confirmed from the amended Article
  113 itself. The previous summary overstated scope four ways: it read the new limbs as a flat ban
  on generation, where Article 5(1a) reaches a provider only on intended purpose or reasonably foreseeable
  reproducible output absent adequate safeguards, and a deployer only on actual use; it said generation
  where the text says generation or manipulation; it dropped the realistic, identifiable-person
  and explicit-consent qualifiers in (ba); and it treated (bb) as standing alone where it is defined
  by cross-reference to Directive 2011/93/EU.'
