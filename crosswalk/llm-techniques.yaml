# Technique -> the obligations a result for it produces evidence for.
#
# Generated from families rather than hand-written per technique: the rationale for
# `llm01-direct-override` and `llm01-encoding-bypass` is genuinely the same sentence,
# and thirty copies of it typed separately would drift. Edit a family here and
# regenerate, or edit an entry directly once it needs its own reason.
#
# last_reviewed: 2026-10-15
schema_version: 1
techniques:
  jailbreak-crescendo:
    obligations:
    - ai-act:Art.15(1)
    - dora:Art.9(4)
    - digitalsikkerhetsloven:digitalsikkerhetsloven § 7
    - digitalsikkerhetsloven:digitalsikkerhetsloven § 10
    - digitalsikkerhetsloven:digitalsikkerhetsforskriften § 10
    - ai-act:Art.15(5)
    - ai-act:Art.55(1)(b)
    rationale: A technique that makes the system depart from its own instructions on crafted input
      is direct evidence about resilience to manipulation. The AI Act requires high-risk systems
      to be resilient to attempts to alter their use or behaviour by exploiting vulnerabilities,
      and the sector security duties require technical measures against exactly this class of attack
      on a service a client depends on.
