name: check
on: [push, pull_request]
jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml pytest jsonschema
      # The bundle is what consumers vendor, so a stale one is a shipped defect
      # rather than an untidy tree. Checked by `test_the_bundle_is_the_sources`,
      # which compares the CONTENT section by section.
      #
      # Deliberately NOT a `git diff` on the file. The snapshot records
      # `generated_from`, the revision it was built from, so a clean rebuild in CI
      # can never byte-match one generated before its own commit existed - the sha
      # it should carry is the sha of the commit that carries it. That check failed
      # on the first push for exactly that reason, on one line, with every byte of
      # the actual data identical.
      - run: python3 -m pytest -q
