# The technique vocabulary. One entry per technique a case can be written against.
#
# WHAT THIS IS FOR, AND WHAT IT IS NOT.
#
# Three different facts about a technique live in three different places, on purpose:
#
#   does `llm01-indirect-doc` exist?        HERE
#   which technique is this case?           the case, in seed-vault, as `taxon:`
#   can we prove it from a chat endpoint?   the harness, which owns its own tooling
#
# Feasibility is deliberately NOT here. Whether a technique can be proved depends on
# what the harness can drive and what access an engagement was granted, and neither is
# a property of the regulation or of the vocabulary.
#
# Membership is asserted by the consumers that resolve a taxon to something, not by the
# corpus that names one. That keeps the corpus free of a dependency on this file and
# makes adding a technique one edit rather than two.
#
# Seeded from the harness's own list on 2026-10-15, which was
# the only copy until this repo existed.
schema_version: 1
techniques:
